services:
  - type: web
    name: perralvpn-frontend
    runtime: static
    branch: main
    buildCommand: echo "No build required"
    staticPublishPath: .
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://api.dicebear.com; connect-src 'self' https://api.perral.dpdns.org; form-action 'self' https://pay-sandbox.sepay.vn https://pay.sepay.vn"
      - path: /api/*
        name: Cache-Control
        value: no-store
